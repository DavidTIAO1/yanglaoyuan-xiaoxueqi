server:
  port: 8080

spring:
  application:
    name: auto-medicine-order

  datasource:
    url: jdbc:mysql://localhost:3306/auto_medicine_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    openai:
      api-key: ${DEEPSEEKCHAT_API}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

# JWT 配置
app:
  jwt:
    secret: ddd9147ffd414592adb176af248cf7bd
    expiration-ms: 86400000
